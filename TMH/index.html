<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý Thông minh hóa SPDV – Ban CLSP VNPT-IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--muted:#5d6878;--line:#e3e7ec;--soft:#f0f3f7;
  --brand:#0a5cc2;--brand-soft:#e8f0fb;--green:#1d7a46;--green-soft:#e3f4ea;--amber:#9a6300;--amber-soft:#fdf3dc;
  --red:#b3261e;--red-soft:#fbe7e5;--purple:#6b3fa0;--purple-soft:#f0e9f8;--gray-soft:#eef1f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
a{color:var(--brand)}
.top{background:linear-gradient(135deg,#0a3f8a,#0a5cc2);color:#fff}
.top .in{max-width:1240px;margin:0 auto;padding:18px 20px 0}
.top .org{font-size:12px;opacity:.85;letter-spacing:.05em;text-transform:uppercase}
.top h1{margin:2px 0 12px;font-size:22px}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs a{color:#dce8fa;text-decoration:none;padding:10px 18px;border-radius:10px 10px 0 0;font-weight:500;white-space:nowrap}
.tabs a:hover{color:#fff;background:rgba(255,255,255,.08)}
.tabs a.on{background:var(--bg);color:var(--ink);font-weight:600}
.tabs a small{opacity:.75;font-weight:400;margin-left:6px;font-size:12px}
main{max-width:1240px;margin:0 auto;padding:20px 20px 60px}
.view{display:none}.view.on{display:block}
h2{font-size:18px;margin:26px 0 10px}
h2:first-child{margin-top:4px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;white-space:nowrap;font-weight:500}
.s-done{background:var(--green-soft);color:var(--green)}.s-run{background:var(--brand-soft);color:var(--brand)}
.s-wait{background:var(--gray-soft);color:var(--muted)}.s-warn{background:var(--amber-soft);color:var(--amber)}
.s-plan{background:var(--purple-soft);color:var(--purple)}
.chip{display:inline-block;padding:0 7px;border-radius:6px;font-size:11.5px;background:var(--soft);color:#3a4553;white-space:nowrap}
/* Tổng quan */
.yrs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.yr{padding:16px 18px;cursor:pointer;transition:border-color .15s}
.yr:hover{border-color:var(--brand)}
.yr .h{display:flex;justify-content:space-between;align-items:center}
.yr .n{font-size:24px;font-weight:700;color:var(--brand)}
.yr .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.yr .nums b{display:block;font-size:19px}.yr .nums span{font-size:12px;color:var(--muted)}
.yr .go{font-size:13px;font-weight:600;color:var(--brand)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-size:12.5px;font-weight:600;color:#3a4553}
tr:last-child td{border-bottom:none}
.tbl{overflow-x:auto}
td.c,th.c{text-align:center}td.r,th.r{text-align:right;white-space:nowrap}
.mx td.c b{color:var(--brand)}
.mx td.c a{text-decoration:none;font-weight:600}
/* Năm */
.yhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.yhead h2{margin:0}
details.info{margin:0 0 6px}
details.info summary{cursor:pointer;color:var(--brand);font-weight:500;font-size:13.5px}
details.info .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
details.info ul{margin:4px 0 0;padding-left:18px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
.kpi{padding:12px 14px}.kpi b{display:block;font-size:20px;line-height:1.25}.kpi span{font-size:12px;color:var(--muted)}
.kpi .bar{height:5px;background:var(--soft);border-radius:4px;margin-top:6px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--green)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.filters input,.filters select{font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.filters input[type=search]{flex:1;min-width:220px}
.filters .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.prod{margin-bottom:10px;overflow:hidden}
.prod>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;align-items:center}
.prod>summary::-webkit-details-marker{display:none}
.prod>summary .nm{font-weight:600;font-size:15px}
.prod>summary .nm::before{content:"▸";display:inline-block;width:16px;color:var(--muted);transition:transform .15s}
.prod[open]>summary .nm::before{transform:rotate(90deg)}
.prod>summary .meta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.prog{display:inline-flex;align-items:center;gap:6px}
.prog .bar{width:70px;height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green)}
.prod table{border-top:1px solid var(--line)}
.prod td{font-size:13.5px}
.items tr{cursor:pointer}.items tr:hover td{background:#f8fafc}
.nd{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* Drawer */
.dim{position:fixed;inset:0;background:rgba(15,25,40,.35);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .2s;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer.on{transform:none}.dim.on{display:block}
.drawer .dh{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;gap:10px}
.drawer .db{padding:14px 18px 40px}
.drawer h3{margin:0;font-size:16px;line-height:1.4}
.drawer dl{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
.drawer dd a{word-break:break-all}
.drawer dt{color:var(--muted);font-size:13px}.drawer dd{margin:0;white-space:pre-line}
.drawer .sec{margin-top:16px;font-weight:600}
.x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
/* Văn bản */
tr.pl td{background:#fafbfc}
.p-qd{background:var(--green-soft);color:var(--green)}.p-cv{background:var(--brand-soft);color:var(--brand)}
.p-tb{background:var(--amber-soft);color:var(--amber)}.p-tt{background:var(--purple-soft);color:var(--purple)}.p-pl{background:var(--gray-soft);color:var(--muted)}
.so{font-weight:600;white-space:nowrap}.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
footer{max-width:1240px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12.5px}
@media(max-width:900px){.yrs{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}details.info .cols{grid-template-columns:1fr}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.prod>summary{grid-template-columns:1fr}.prod>summary .meta{justify-content:flex-start}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="org">VNPT-IT · Ban Chiến lược Sản phẩm</div>
  <h1>Quản lý Thông minh hóa sản phẩm, dịch vụ (TMH)</h1>
  <nav class="tabs" id="tabs"></nav>
</div></div>
<main id="main">
  <section class="view" id="v-tongquan"></section>
  <section class="view" id="v-nam"></section>
  <section class="view" id="v-vanban"></section>
</main>
<footer>Nguồn: hồ sơ TMH 2025, báo cáo tiến độ tháng 10/2026, biểu mẫu đề xuất kế hoạch 2027, phiếu đăng ký TMH 2027 các đơn vị · Dữ liệu tại <code>TMH/data/</code> · <a href="../">Danh sách báo cáo</a></footer>
<div class="dim" id="dim"></div>
<aside class="drawer" id="drawer"></aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
const fmt = v => v == null ? '–' : (Math.round(v*10)/10).toLocaleString('vi-VN');
const uniq = a => [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'vi'));
let HM = [], VB = {van_ban:[],dan_chieu:[]}, NAM = [], PH = null;
const phieuOf = sp => PH ? PH.phieu.filter(p=>p.sp===sp) : [];

const ttCls = t => ({'Hoàn thành':'s-done','Đang thực hiện':'s-run','Chưa đến hạn':'s-wait','Chưa ban hành':'s-warn','Đề xuất':'s-plan'}[t] || 's-wait');
const pvShort = v => v.startsWith('TĐ giao') ? 'TĐ giao' : v.startsWith('Công ty') ? 'Công ty giao' : v.startsWith('Ngoài') ? 'Ngoài 12 ND' : v.startsWith('Đề xuất trong') ? 'Trong KH NCPB' : v;
const pvRank = v => v.startsWith('TĐ') ? 0 : v.startsWith('Công ty') ? 1 : v.startsWith('Giao mới') ? 0 : 2;
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const pctOf = it => it.pct == null ? (it.tt==='Hoàn thành'?1:0) : it.pct;

function stats(list){
  const sp = uniq(list.map(i=>i.sp)).length;
  const done = list.filter(i=>i.tt==='Hoàn thành').length;
  const sum = k => list.reduce((s,i)=> s + (k==='mm_it'||k==='mm_it_th' ? (i.mm_it_ncpt?0:(i[k]||0)) : (i[k]||0)), 0);
  return {sp, n:list.length, done, it:sum('mm_it'), itth:sum('mm_it_th'), ai:sum('mm_ai'), aith:sum('mm_ai_th')};
}

/* ---------- Tabs ---------- */
function renderTabs(cur){
  const t = [['tongquan','Tổng quan']].concat(NAM.map(n=>[String(n.nam), `Năm ${n.nam}<small>${n.trang_thai}</small>`])).concat([['vanban','Văn bản']]);
  $('#tabs').innerHTML = t.map(([k,l])=>`<a href="#${k}" class="${k===cur?'on':''}">${l}</a>`).join('');
}

/* ---------- Tổng quan ---------- */
function renderTongQuan(){
  const cards = NAM.map(n=>{
    const L = HM.filter(i=>i.nam===n.nam), s = stats(L);
    const mm = n.mm ? `${fmt(n.mm.it_dk)} / ${fmt(n.mm.ai_dk)}` : 'Không theo dõi';
    return `<div class="card yr" onclick="location.hash='${n.nam}'">
      <div class="h"><span class="n">${n.nam}</span><span class="pill ${n.nam===2027?'s-plan':n.nam===2026?'s-run':'s-done'}">${esc(n.trang_thai)}</span></div>
      <div class="small muted">${esc(n.tieu_de)}</div>
      <div class="nums"><div><b>${s.sp}</b><span>sản phẩm</span></div><div><b>${s.n}</b><span>hạng mục</span></div><div><b>${n.nam===2027?'–':s.done}</b><span>hoàn thành</span></div></div>
      <div class="small">MM đăng ký IT / AI: <b>${mm}</b></div>
      <div class="go" style="margin-top:8px">Xem chi tiết năm ${n.nam} →</div></div>`;}).join('');
  // Ma trận sản phẩm × năm
  const key = sp => ({'vnEdu Connect':'vnEdu / Connect / Teacher','vnEdu / Connect / Teacher':'vnEdu / Connect / Teacher','vnEdu LMS / E-Learning':'vnEdu LMS','vnEdu LMS':'vnEdu LMS','HIS hợp nhất':'VNPT HIS / HMIS','VNPT HMIS':'VNPT HIS / HMIS','vnEdu Hss':'vnEdu HSS'}[sp] || sp);
  const m = {};
  HM.forEach(i=>{const k=key(i.sp); m[k]=m[k]||{dv:i.dv}; m[k][i.nam]=(m[k][i.nam]||0)+1;});
  const rows = Object.entries(m).sort((a,b)=>a[1].dv.localeCompare(b[1].dv)||a[0].localeCompare(b[0],'vi'));
  const mx = rows.map(([sp,v])=>`<tr><td>${esc(sp)}</td><td>${esc(v.dv)}</td>${NAM.map(n=>`<td class="c">${v[n.nam]?`<a href="#${n.nam}" onclick="presetSP('${esc(sp)}')">${v[n.nam]}</a>`:'<span class="muted">–</span>'}</td>`).join('')}</tr>`).join('');
  $('#v-tongquan').innerHTML = `<h2>Tổng quan các năm</h2><div class="yrs">${cards}</div>
   <h2>Sản phẩm qua các năm <span class="small muted">(số hạng mục; bấm số để xem chi tiết)</span></h2>
   <div class="card tbl mx"><table><thead><tr><th>Sản phẩm</th><th>Đơn vị</th>${NAM.map(n=>`<th class="c">${n.nam}</th>`).join('')}</tr></thead><tbody>${mx}</tbody></table></div>`;
}
let PRESET_SP = '';
function presetSP(sp){ PRESET_SP = sp; }

/* ---------- Năm ---------- */
const F = {q:'',dv:'',sp:'',pv:'',loai:'',tt:'',ph:''};
function phieuSection(L){
  if (!PH) return '';
  const by = {}; L.forEach(i=>{(by[i.sp]=by[i.sp]||{dv:i.dv,n:0}).n++;});
  const sps = Object.keys(by).sort((a,b)=>by[a].dv.localeCompare(by[b].dv)||a.localeCompare(b,'vi'));
  const co = sps.filter(sp=>phieuOf(sp).length);
  const nf = new Set(PH.phieu.filter(p=>p.sp).map(p=>p.file)).size;
  const ngoai = PH.phieu.filter(p=>!p.sp);
  const fl = P => P.map(p=>p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.file)}</a>`:esc(p.file)).join('<br>');
  const rows = sps.map(sp=>{const P=phieuOf(sp); return `<tr><td>${esc(sp)}</td><td>${esc(by[sp].dv)}</td><td class="c">${by[sp].n}</td><td class="c">${P.length||'–'}</td>
    <td><span class="pill ${P.length?'s-done':'s-warn'}">${P.length?'Có phiếu':'Chưa có phiếu'}</span></td><td class="small">${P.length?fl(P):''}${P.filter(p=>p.gc).map(p=>`<div class="sub" style="color:var(--amber)">${esc(p.gc)}</div>`).join('')}</td></tr>`;}).join('');
  return `<details class="card pad" open><summary><b>Đối chiếu phiếu đăng ký TMH</b> <span class="small muted">· ${co.length}/${sps.length} sản phẩm có phiếu (${nf} file) · ${sps.length-co.length} chưa có · ${ngoai.length} phiếu ngoài danh sách đăng ký · cập nhật ${esc(PH.cap_nhat)}</span></summary>
   <div class="small muted" style="margin:6px 0">${esc(PH.ghi_chu)}</div>
   <div class="tbl"><table><thead><tr><th>Sản phẩm</th><th>Đơn vị</th><th class="c">Số hạng mục</th><th class="c">Số phiếu</th><th>Trạng thái phiếu</th><th>File phiếu</th></tr></thead><tbody>${rows}</tbody></table></div>
   ${ngoai.length?`<div class="sec" style="margin-top:10px"><b class="small">Phiếu chưa có trong danh sách đăng ký TMH 2027</b></div>
   <div class="tbl"><table><thead><tr><th>Sản phẩm / nội dung</th><th>Đơn vị</th><th>File phiếu</th></tr></thead><tbody>${ngoai.map(p=>`<tr><td>${esc(p.ten)}</td><td>${esc(p.dv)}</td><td class="small">${fl([p])}</td></tr>`).join('')}</tbody></table></div>`:''}
  </details>`;
}
function renderNam(nam){
  const n = NAM.find(x=>x.nam===nam), L = HM.filter(i=>i.nam===nam), s = stats(L);
  const mm = n.mm;
  const kp = [
    [s.sp,'sản phẩm'],[s.n,'hạng mục'],
    nam===2027 ? [L.filter(i=>i.pham_vi==='Giao mới').length,'giao mới'] : [`${s.done}/${s.n}`,'hoàn thành',s.n?s.done/s.n:0],
    nam===2027 ? [L.filter(i=>i.pham_vi!=='Giao mới').length,'trong KH nâng cấp PB'] : [L.filter(i=>i.tt==='Đang thực hiện').length,'đang thực hiện'],
    ...(!mm ? [[L.filter(i=>i.loai==='Tính năng AI').length+' / '+L.filter(i=>i.loai==='UI/UX').length,'tính năng AI / UI-UX'],[L.filter(i=>i.tt==='Chưa ban hành').length,'gói cước chưa ban hành']] : [
    [mm?`${fmt(mm.it_th ?? mm.it_dk)}${mm.it_th!=null?' / '+fmt(mm.it_dk):''}`:'–', mm? (mm.it_th!=null?'MM VNPT-IT đã TH / ĐK':'MM VNPT-IT đề xuất'):'MM VNPT-IT (không theo dõi)', mm&&mm.it_th!=null?mm.it_th/mm.it_dk:null],
    [mm?`${fmt(mm.ai_th ?? mm.ai_dk)}${mm.ai_th!=null?' / '+fmt(mm.ai_dk):''}`:'–', mm? (mm.ai_th!=null?'MM VNPT AI đã TH / ĐK':'MM VNPT AI đề xuất'):'MM VNPT AI (không theo dõi)', mm&&mm.ai_th!=null?mm.ai_th/mm.ai_dk:null]])
  ].map(([b,t,p])=>`<div class="card kpi"><b>${b}</b><span>${t}</span>${p!=null&&p!==undefined?`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`:''}</div>`).join('');
  const opt = (id,lab,vals) => `<select id="${id}"><option value="">${lab}</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}</select>`;
  $('#v-nam').innerHTML = `
   <div class="yhead"><div><h2>${esc(n.tieu_de)}</h2><div class="small muted">${esc(n.bao_cao)}</div></div>
     <span class="pill ${nam===2027?'s-plan':nam===2026?'s-run':'s-done'}">${esc(n.trang_thai)}</span></div>
   <div class="kpis">${kp}</div>
   <details class="info card pad"><summary>Căn cứ và điểm chính</summary><div class="cols">
     <div><b class="small">Căn cứ</b><ul class="small">${n.can_cu.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
     <div><b class="small">Điểm chính</b><ul class="small">${n.diem_chinh.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
     ${mm?`<div class="small muted" style="margin-top:6px">MM: ${esc(mm.ghi_chu)}</div>`:''}</div></div></details>
   ${nam===2027?phieuSection(L):''}
   <div class="filters">
     <input type="search" id="fq" placeholder="Tìm nội dung, sản phẩm, đầu mối… (gõ không dấu được)">
     ${opt('fdv','Đơn vị',uniq(L.map(i=>i.dv)))}${opt('fsp','Sản phẩm',uniq(L.map(i=>i.sp)))}
     ${opt('fpv','Phạm vi giao',uniq(L.map(i=>i.pham_vi)).map(pvShort).filter((v,i,a)=>a.indexOf(v)===i))}${opt('floai','Loại',uniq(L.map(i=>i.loai)))}
     ${nam===2027?(PH?opt('fph','Phiếu đăng ký',['Có phiếu','Chưa có phiếu']):''):opt('ftt','Trạng thái',uniq(L.map(i=>i.tt)))}
     <button class="btn" id="bx">Mở/đóng tất cả</button><span class="cnt" id="cnt"></span>
   </div>
   <div id="groups"></div>
   <h2>Văn bản năm ${nam} <span class="small muted">(<a href="#vanban" onclick="VBF.tm='${nam===2027?'':nam}'">xem đầy đủ</a>)</span></h2>
   <div id="yvb"></div>`;
  Object.keys(F).forEach(k=>F[k]='');
  if (PRESET_SP){ const o=[...$('#fsp').options].find(o=>o.value===PRESET_SP || PRESET_SP.includes(o.value) || o.value.includes(PRESET_SP.split(' / ')[0])); if(o){$('#fsp').value=o.value;F.sp=o.value;} PRESET_SP=''; }
  [['fq','q'],['fdv','dv'],['fsp','sp'],['fpv','pv'],['floai','loai'],['ftt','tt'],['fph','ph']].forEach(([id,k])=>{const el=$('#'+id); if(el) el.addEventListener('input',()=>{F[k]=el.value; drawGroups(nam);});});
  $('#bx').onclick = () => { const ds=[...document.querySelectorAll('#groups details')]; const open=!ds.every(d=>d.open); ds.forEach(d=>d.open=open); };
  drawGroups(nam);
  const vb = VB.van_ban.filter(v=>v.tm===String(nam) && !v.stt.includes('.'));
  $('#yvb').innerHTML = vb.length ? `<div class="card tbl"><table><thead><tr><th>Ngày</th><th>Số văn bản</th><th>Trích yếu</th><th>Ban hành</th></tr></thead><tbody>${vb.map(v=>`<tr><td class="r">${v.ngay}</td><td class="so">${esc(v.so)}</td><td>${esc(v.ty)}</td><td class="small">${esc(v.bh)}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="card empty">Chưa có văn bản năm ${nam} trong danh mục.</div>`;
}
function drawGroups(nam){
  const q = fold(F.q);
  const L = HM.filter(i=>i.nam===nam && (!F.dv||i.dv===F.dv) && (!F.sp||i.sp===F.sp) && (!F.pv||pvShort(i.pham_vi)===F.pv) && (!F.loai||i.loai===F.loai) && (!F.tt||i.tt===F.tt) && (!F.ph||(phieuOf(i.sp).length?'Có phiếu':'Chưa có phiếu')===F.ph)
     && (!q || fold([i.nd,i.mt,i.sp,i.kq,i.gc,i.pdm,i.cq,i.nhom].join(' ')).includes(q)));
  $('#cnt').textContent = `${L.length} hạng mục`;
  const by = {}; L.forEach(i=>{(by[i.sp]=by[i.sp]||[]).push(i);});
  const rk = sp => Math.min(...by[sp].map(i=>pvRank(i.pham_vi)));
  const ks = Object.keys(by).sort((a,b)=>rk(a)-rk(b)||by[a][0].dv.localeCompare(by[b][0].dv)||a.localeCompare(b,'vi'));
  const many = L.length > 30 && !q && !F.sp;
  $('#groups').innerHTML = ks.length ? ks.map(sp=>{
    const G = by[sp], s = stats(G), p = G.reduce((a,i)=>a+pctOf(i),0)/G.length;
    const pdm = uniq(G.map(i=>i.pdm)).join(', '), cq = uniq(G.map(i=>i.cq)).join(', ');
    const mmTxt = (s.it||s.ai) ? `MM IT ${fmt(s.it)} · AI ${fmt(s.ai)}` : '';
    return `<details class="card prod" ${many?'':'open'}><summary>
      <div><span class="nm">${esc(sp)}</span> <span class="chip">${esc(G[0].dv)}</span>
        ${pdm?`<div class="small muted" style="margin-left:16px">PdM: ${esc(pdm)}${cq?' · Chuyên quản: '+esc(cq):''}</div>`:''}</div>
      <div class="meta">${nam===2027&&PH?(()=>{const P=phieuOf(sp);return P.length?(P[0].url?`<a class="pill s-done" href="${esc(P[0].url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${esc(P.map(p=>p.file).join(', '))}">Có phiếu</a>`:`<span class="pill s-done" title="${esc(P.map(p=>p.file).join(', '))}">Có phiếu</span>`):'<span class="pill s-warn">Chưa có phiếu</span>';})():''}<span>${G.length} hạng mục</span>${mmTxt?`<span>${mmTxt}</span>`:''}
        ${nam!==2027?`<span class="prog"><span class="bar"><i style="width:${Math.round(p*100)}%"></i></span>${Math.round(p*100)}%</span>`:''}</div></summary>
      <div class="tbl"><table class="items"><thead><tr><th style="width:46%">Nội dung</th><th>Loại</th><th>Phạm vi</th><th class="r">Hạn</th><th class="r">MM IT</th><th class="r" title="Đăng ký; TH = đã thực hiện khi không có số đăng ký">MM AI</th><th>Trạng thái</th></tr></thead><tbody>
      ${G.map(i=>`<tr onclick="openItem(${i.id})"><td><div class="nd">${esc(i.nd)}</div>${i.nhom?`<div class="sub">${esc(i.nhom)}</div>`:''}</td>
        <td><span class="chip">${esc(i.loai)}</span></td><td><span class="chip" title="${esc(i.pham_vi)}">${esc(pvShort(i.pham_vi))}</span></td><td class="r">${esc(i.han)}</td>
        <td class="r">${i.mm_it!=null?fmt(i.mm_it)+(i.mm_it_ncpt?'*':''):'–'}</td><td class="r">${i.mm_ai!=null?fmt(i.mm_ai):(i.mm_ai_th!=null?fmt(i.mm_ai_th)+' TH':'–')}</td>
        <td><span class="pill ${ttCls(i.tt)}">${esc(i.tt)}${i.tt==='Đang thực hiện'&&i.pct?' '+Math.round(i.pct*100)+'%':''}</span></td></tr>`).join('')}
      </tbody></table></div></details>`;}).join('') + (L.some(i=>i.mm_it_ncpt)?'<div class="small muted">* MM VNPT-IT đã đăng ký trong kế hoạch NCPT, không cộng vào tổng TMH.</div>':'')
    : '<div class="card empty">Không có hạng mục phù hợp bộ lọc.</div>';
}
function openItem(id){
  const i = HM.find(x=>x.id===id); if(!i) return;
  const row = (k,v) => v!=null && v!=='' ? `<dt>${k}</dt><dd>${linkify(v)}</dd>` : '';
  const mm = (a,b) => a==null&&b==null ? '' : `${a!=null?fmt(a)+' đăng ký':''}${a!=null&&b!=null?' · ':''}${b!=null?fmt(b)+' đã thực hiện':''}`;
  $('#drawer').innerHTML = `<div class="dh"><div><div class="small muted">${i.nam} · ${esc(i.dv)} · ${esc(i.sp)}</div><h3>${esc(i.nd)}</h3></div><button class="x" onclick="closeItem()" aria-label="Đóng">×</button></div>
   <div class="db"><dl>
    ${row('Trạng thái', i.tt + (i.pct!=null&&i.pct<1&&i.pct>0?` (${Math.round(i.pct*100)}%)`:''))}${row('Loại', i.loai)}${row('Nhóm', i.nhom)}${row('Phạm vi giao', i.pham_vi)}
    ${row('Phiên bản', i.phien_ban)}${row('Thời hạn', i.han)}${row('MM VNPT-IT', mm(i.mm_it,i.mm_it_th))}${row('MM VNPT AI', mm(i.mm_ai,i.mm_ai_th))}
    ${row('Đầu mối PdM', i.pdm)}${row('Chuyên quản CLSP', i.cq)}
    ${row('Mục tiêu / kết quả cần đạt', i.mt)}${row('Đã thực hiện', i.kq)}${row('Ghi chú', i.gc)}</dl>
    ${i.moc&&i.moc.length?`<div class="sec">Các mốc</div><div class="tbl card" style="margin-top:6px"><table><thead><tr><th>Mốc</th><th class="r">Hạn</th><th>Tiến độ / kết quả</th></tr></thead><tbody>${i.moc.map(m=>`<tr><td>${esc(m.nd)}</td><td class="r">${esc(m.han)}</td><td class="small">${m.pct!=null?Math.round(m.pct*100)+'%':(m.tt||'')}${m.kq?' – '+esc(m.kq):''}</td></tr>`).join('')}</tbody></table></div>`:''}
   </div>`;
  $('#drawer').classList.add('on'); $('#dim').classList.add('on');
}
function closeItem(){ $('#drawer').classList.remove('on'); $('#dim').classList.remove('on'); }
$('#dim').onclick = closeItem; document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeItem(); });

/* ---------- Văn bản ---------- */
const VBF = {tm:'',q:'',loai:'',pl:true};
const pillCls = l => l.startsWith('Quyết định') ? 'p-qd' : l.startsWith('Thông báo') ? 'p-tb' : l.startsWith('Tờ trình') ? 'p-tt' : (l==='Phụ lục'||l==='Tài liệu kèm') ? 'p-pl' : 'p-cv';
function renderVanBan(){
  const D = VB.van_ban;
  $('#v-vanban').innerHTML = `<h2>Danh mục văn bản có số</h2>
   <div class="small muted" style="margin-bottom:8px">Văn bản PDF đã có số và phụ lục kèm theo trong thư mục TMH 2025, 2026. Báo cáo tiến độ hằng tháng chỉ có bản Word nên chưa đưa vào.</div>
   <div class="filters"><input type="search" id="vq" placeholder="Tìm số, trích yếu, đơn vị… (ví dụ: 464, HKD, iOffice)">
    <select id="vtm"><option value="">Thư mục: tất cả</option><option value="2025">Thư mục TMH 2025</option><option value="2026">Thư mục TMH 2026</option></select>
    <select id="vloai"><option value="">Loại: tất cả</option>${uniq(D.map(d=>d.loai)).map(v=>`<option>${esc(v)}</option>`).join('')}</select>
    <label class="small"><input type="checkbox" id="vpl" checked> Hiện phụ lục</label><span class="cnt" id="vcnt"></span></div>
   <div class="card tbl"><table><thead><tr><th>Thư mục</th><th>STT</th><th class="r">Ngày</th><th>Số văn bản</th><th>Loại</th><th>Trích yếu</th><th>Ban hành</th></tr></thead><tbody id="vtb"></tbody></table></div>
   <h2>Văn bản được dẫn chiếu, chưa có bản PDF</h2>
   <div class="card tbl"><table><thead><tr><th>Số văn bản</th><th class="r">Ngày</th><th>Trích yếu (theo nơi dẫn chiếu)</th></tr></thead><tbody>
   ${VB.dan_chieu.map(r=>`<tr><td class="so">${esc(r.so)}</td><td class="r">${esc(r.ngay)}</td><td>${esc(r.ty)}</td></tr>`).join('')}</tbody></table></div>`;
  $('#vtm').value = VBF.tm;
  [['vq','q'],['vtm','tm'],['vloai','loai']].forEach(([id,k])=>$('#'+id).addEventListener('input',e=>{VBF[k]=e.target.value; drawVB();}));
  $('#vpl').addEventListener('input',e=>{VBF.pl=e.target.checked; drawVB();});
  drawVB();
}
function drawVB(){
  const q = fold(VBF.q);
  const R = VB.van_ban.filter(d=>(!VBF.tm||d.tm===VBF.tm)&&(!VBF.loai||d.loai===VBF.loai)&&(VBF.pl||!d.stt.includes('.'))&&(!q||fold([d.so,d.ty,d.bh,d.nn,d.pl,d.gc,d.ngay].join(' ')).includes(q)));
  $('#vcnt').textContent = `${R.length} dòng`;
  $('#vtb').innerHTML = R.length ? R.map(d=>`<tr class="${d.stt.includes('.')?'pl':''}"><td>${d.tm}</td><td>${d.stt}</td><td class="r">${d.ngay}</td><td class="so">${esc(d.so)}</td>
    <td><span class="pill ${pillCls(d.loai)}">${esc(d.loai)}</span></td>
    <td>${esc(d.ty)}${d.pl?`<div class="sub">Phụ lục: ${esc(d.pl)}</div>`:''}${d.gc?`<div class="sub">Ghi chú: ${esc(d.gc)}</div>`:''}</td>
    <td class="small">${esc(d.bh)}${d.nn?`<div class="sub">Gửi: ${esc(d.nn)}</div>`:''}</td></tr>`).join('') : '<tr><td colspan="7" class="empty">Không có văn bản phù hợp.</td></tr>';
}

/* ---------- Router ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1)) || 'tongquan';
  const nam = NAM.find(n=>String(n.nam)===h);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  closeItem();
  if (nam){ renderNam(nam.nam); $('#v-nam').classList.add('on'); renderTabs(h); }
  else if (h==='vanban'){ renderVanBan(); $('#v-vanban').classList.add('on'); renderTabs(h); }
  else { renderTongQuan(); $('#v-tongquan').classList.add('on'); renderTabs('tongquan'); }
  window.scrollTo(0,0);
}
Promise.all([...['data/nam.json','data/hang_muc.json','data/van_ban.json'].map(u=>fetch(u).then(r=>r.json())), fetch('data/phieu.json').then(r=>r.ok?r.json():null).catch(()=>null)])
 .then(([n,h,v,p])=>{NAM=n;HM=h;VB=v;PH=p;window.addEventListener('hashchange',route);route();})
 .catch(()=>{$('#main').innerHTML='<div class="card empty">Không tải được dữ liệu. Vui lòng tải lại trang.</div>';});
</script>
</body>
</html>
